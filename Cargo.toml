[package]
name = "fablegame"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "fablegame"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
earcutr = "0.5.0"
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
ab_glyph = "0.2.32"
env_logger = "0.11.11"
flate2 = "1.1.11"
gilrs = "0.11.2"
glam = { version = "0.34.3", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
parking_lot = "0.13.0"
pollster = "1.0.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"
wgpu = "30"
winit = "0.30"
roxmltree = "0.20"
rustc-hash = "2"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
# opens Feral GameMode's client library at run time (gamemode.rs)
libloading = "0.8"

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in", "msl-out-if-target-apple"] }

# on a Mac the shader tests compile the translated shaders with the system's Metal compiler.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"

# full lto and one codegen unit for faster release builds.
[profile.release]
lto = "fat"
codegen-units = 1

# optimised dependencies so debug builds stay playable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
